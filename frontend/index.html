<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SESCO: gestión de asistencia escolar mediante códigos QR dinámicos."
    />
    <title>SESCO · Asistencia escolar</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello claro
      // al recargar con el modo oscuro activo.
      ;(function () {
        try {
          var guardado = localStorage.getItem('sesco_tema')
          var prefiereOscuro = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var oscuro =
            guardado === 'dark' || (guardado !== 'light' && prefiereOscuro)
          document.documentElement.classList.toggle('dark', oscuro)
          document.documentElement.style.colorScheme = oscuro
            ? 'dark'
            : 'light'
        } catch (error) {
          // Sin acceso al almacenamiento se mantiene el tema claro.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
